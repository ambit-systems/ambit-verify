name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.14"]
        include:
          # uv 0.9.10 archives verified against upstream release bytes.
          - os: "ubuntu-latest"
            uv-checksum: "440c4215b171e64061d65d16a23753dd25c29a7f7b1b0446c9e9aed0fa372f27"
          - os: "macos-latest"
            uv-checksum: "af171d5a4eb1c502819de32740aa811ff71851b1f5ec2d8bd0dda302ed9554c2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.10"
          checksum: "${{ matrix.uv-checksum }}"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
        env:
          RUNNER_TOOL_CACHE: "${{ runner.temp }}/ambit-uv-tool-cache"

      - name: Install dependencies
        run: uv sync --extra dev --group build --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

      - name: Build distributions
        run: uv build --no-build-isolation

      - name: Smoke test the wheel
        run: |
          uv venv --python ${{ matrix.python-version }} /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/ambit-verify samples/five-receipts/evidence.jsonl \
            --public-key "$(cat samples/five-receipts/evidence.jsonl.attest-public-key)"
