# Publishes to PyPI on a version tag through trusted publishing (OIDC).
# No API token is stored. The PyPI project must list this repository,
# this workflow file name, and the "pypi" environment as a trusted publisher.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.10"
          checksum: "440c4215b171e64061d65d16a23753dd25c29a7f7b1b0446c9e9aed0fa372f27"
          python-version: "3.12"
        env:
          RUNNER_TOOL_CACHE: "${{ runner.temp }}/ambit-uv-tool-cache"

      - name: Check the tag matches the package version
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          }

      - name: Install locked build backend
        run: uv sync --group build --locked --no-install-project

      - name: Build sdist and wheel
        run: uv build --no-build-isolation

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ambit-verify/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # pypa/gh-action-pypi-publish v1.14.2, pinned by commit SHA.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
