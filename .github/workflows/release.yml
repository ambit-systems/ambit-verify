# Publishes to PyPI on a version tag through trusted publishing (OIDC).
# No API token is stored. The PyPI project must list this repository,
# this workflow file name, and the "pypi" environment as a trusted publisher.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          }

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ambit-verify/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # pypa/gh-action-pypi-publish v1.14.2, pinned by commit SHA.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
